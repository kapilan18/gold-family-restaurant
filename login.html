<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gold Family Restaurant & Luxury Dining</title>
    <meta name="description" content="Login to your Gold Restaurant account to view your past orders, manage table reservations, and experience personalized dining.">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Luxury CSS -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .auth-container {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
            background: radial-gradient(circle at 50% 30%, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-lg);
            padding: 36px 32px;
            box-shadow: var(--shadow-card);
        }
        .input-group-luxury {
            position: relative;
        }
        .input-group-luxury i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-primary);
            font-size: 1rem;
        }
        .input-group-luxury input {
            padding-left: 42px;
            padding-right: 42px;
        }
        .password-toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-luxury sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <div class="brand-badge"><i class="fas fa-crown"></i></div>
                <span>GOLD <span class="text-gold">RESTAURANT</span></span>
            </a>

            <div class="ms-auto d-flex align-items-center gap-3">
                <a href="index.html" class="nav-link text-muted small"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
            </div>
        </div>
    </nav>

    <!-- ================= AUTH SECTION ================= -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="brand-badge mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.6rem;">
                    <i class="fas fa-crown"></i>
                </div>
                <h3 class="font-luxury mb-1">Welcome Back</h3>
                <p class="text-muted small">Access your royal dining account</p>
            </div>

            <!-- Alert Box -->
            <div id="loginAlert" class="alert alert-danger py-2 small mb-3" style="display: none;" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label-luxury">Email Address</label>
                    <div class="input-group-luxury">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="form-control-luxury" id="loginEmail" required placeholder="name@email.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label-luxury">Password</label>
                    <div class="input-group-luxury">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-control-luxury" id="loginPassword" required placeholder="Enter password">
                        <button type="button" class="password-toggle-btn" id="togglePasswordBtn">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="javascript:void(0)" onclick="alert('Please contact support at 091594 224449 to reset your password.')" class="small text-gold">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-gold w-100 py-3 fw-bold" id="loginSubmitBtn">
                    <i class="fas fa-sign-in-alt me-2"></i> Sign In to Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top" style="border-color: rgba(255,255,255,0.08) !important;">
                <p class="small text-muted mb-0">
                    Don't have an account yet? 
                    <a href="register.html" class="text-gold fw-bold ms-1">Create Account</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = 'https://gold-family-restaurant.onrender.com/api';

        // Toggle password visibility
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('loginPassword');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // Login submission
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('loginAlert');
        const submitBtn = document.getElementById('loginSubmitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.style.display = 'none';

            const email = document.getElementById('loginEmail').value.trim();
            const password = passwordInput.value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Verifying...';

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success && data.token) {
                    const storage = document.getElementById('rememberMe').checked ? localStorage : sessionStorage;
                    storage.setItem('token', data.token);
                    storage.setItem('user', JSON.stringify(data.user));

                    alertBox.className = 'alert alert-success py-2 small mb-3';
                    alertBox.textContent = 'Login successful! Redirecting...';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 600);
                } else {
                    alertBox.className = 'alert alert-danger py-2 small mb-3';
                    alertBox.textContent = data.message || 'Invalid email or password.';
                    alertBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Sign In to Account';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger py-2 small mb-3';
                alertBox.textContent = 'Cannot connect to server. Please ensure backend is running.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Sign In to Account';
            }
        });
    </script>
</body>
</html>
